name: Build and push testing image

on:
  schedule:
  - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Testing image is built from the branch of the last stable image,
  # this branch is created by the stable workflow (release_stable.yml)
  check_branch:
    name: Find last version branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - name: Get last version branch of this repository
        id: branch
        run: |
          name=$(git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" | sed -n 's#.*refs/heads/\([0-9][0-9.]*\)$#\1#p' | sort -V | tail -n 1)
          if [ -z "$name" ]; then
            echo "::error::No version branch found in this repository"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Testing image is built from branch ${name}." >> "$GITHUB_STEP_SUMMARY"

  do_image:
    needs: check_branch
    name: Testing image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      canal: testing
      ref: ${{ needs.check_branch.outputs.branch }}
      tags: testing
      scout_environment: testing
