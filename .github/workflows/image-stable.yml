# Stable image is built once, when a new Dotclear release is published.
# To build again the last stable image, use workflow "2. Rebuild last stable image".
name: Image - stable (new Dotclear release)

on:
  schedule:
  - cron: '15 10 * * *'
  workflow_call:
    inputs:
      force:
        description: 'Build image even if it already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTCLEAR_IMAGE: docker-dotclear
  DOCKER_NAMESPACE: jcpd

jobs:
  check_image:
    name: Check and compare official Dotclear version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.dotclear.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      archive_url: ${{ steps.published.outputs.url }}
      archive_md5: ${{ steps.published.outputs.md5 }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Get last dotclear repository tag
        id: dotclear
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/dotclear/dotclear.git | sed -n 's#.*refs/tags/\([0-9][0-9.]*\)$#\1#p' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "::error::Dotclear repository tag not found"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Last Dotclear repository tag is ${tag}." >> "$GITHUB_STEP_SUMMARY"

      # Stable release announced by versions.xml can be late on the repository tag.
      # Its archive URL and checksum are stored in the version branch (see create_branch).
      - name: Get published Dotclear stable release
        id: published
        run: |
          release=$(bash .github/scripts/dotclear-release.sh stable)
          echo "$release" >> "$GITHUB_OUTPUT"
          version=$(echo "$release" | sed -n 's/^version=//p')
          url=$(echo "$release" | sed -n 's/^url=//p')
          if [ -z "$url" ]; then
            echo "::warning::Dotclear stable archive URL or checksum not found in versions.xml"
          fi
          echo "Published Dotclear stable version is ${version:-unknown} (${url:-archive not found})." >> "$GITHUB_STEP_SUMMARY"

      - name: Check registry image
        id: registry
        env:
          TAG: ${{ steps.dotclear.outputs.tag }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://hub.docker.com/v2/repositories/${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}/tags/${TAG}")
          case "$code" in
            200) exists=true ;;
            404) exists=false ;;
            *) echo "::error::Unexpected Docker Hub response ${code}"; exit 1 ;;
          esac
          echo "image_exists=${exists}" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "Image ${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}:${TAG} found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image ${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}:${TAG} not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide
        id: decide
        env:
          TAG: ${{ steps.dotclear.outputs.tag }}
          PUBLISHED: ${{ steps.published.outputs.version }}
          EXISTS: ${{ steps.registry.outputs.image_exists }}
          FORCE: ${{ inputs.force }}
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 2.40.0 and 2.40 are the same version
          function normalize { echo "$1" | sed -E 's/(\.0)+$//'; }
          build=false
          if [ "$EXISTS" = "false" ]; then
            build=true
          elif [ "$FORCE" = "true" ]; then
            build=true
            echo "Rebuilding image ${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}:${TAG} is forced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$build" = "true" ] && [ -n "$PUBLISHED" ] && [ "$(normalize "$PUBLISHED")" != "$(normalize "$TAG")" ]; then
            build=false
            echo "::warning::Dotclear ${TAG} is tagged but published stable release is ${PUBLISHED}, image not built"
            echo "Dotclear ${TAG} is tagged but published stable release is ${PUBLISHED}: image is not built, next run will try again." >> "$GITHUB_STEP_SUMMARY"
            text="⏳ <b>${DOTCLEAR_IMAGE}</b>: Dotclear <b>${TAG}</b> is tagged but published stable release is still <b>${PUBLISHED}</b>, stable image not built yet."
            text+=$'\n'"<a href=\"${RUN_URL}\">Workflow run</a>"
            bash .github/scripts/telegram.sh "$text"
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  # Stable images are frozen: the version branch is created once from master
  # with the URL and checksum of its Dotclear archive (etc/dotclear-stable.lock),
  # then this branch is never modified by this workflow. Rebuilding the image
  # from this branch always uses the same Dotclear archive.
  create_branch:
    needs: check_image
    if: ${{ needs.check_image.outputs.build == 'true' }}
    name: Create version branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check repository branch
        id: branch
        env:
          BRANCH: ${{ needs.check_image.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch ${BRANCH} already exists, it is not modified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repo
        if: ${{ steps.branch.outputs.exists == 'false' }}
        uses: actions/checkout@v7

      - name: Create repository branch
        if: ${{ steps.branch.outputs.exists == 'false' }}
        env:
          BRANCH: ${{ needs.check_image.outputs.version }}
          ARCHIVE_URL: ${{ needs.check_image.outputs.archive_url }}
          ARCHIVE_MD5: ${{ needs.check_image.outputs.archive_md5 }}
        run: |
          git config user.name 'github-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          if [ -n "$ARCHIVE_URL" ] && [ -n "$ARCHIVE_MD5" ] && [ -f etc/dotclear-stable.lock ]; then
            sed -i -e "s#^url=.*#url=${ARCHIVE_URL}#" -e "s#^md5=.*#md5=${ARCHIVE_MD5}#" etc/dotclear-stable.lock
            git commit -q -m "Set Dotclear ${BRANCH} archive" etc/dotclear-stable.lock
            echo "Branch ${BRANCH} has been created from ${GITHUB_REF_NAME} with Dotclear archive ${ARCHIVE_URL}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Branch ${BRANCH} created without Dotclear archive, its image can not be rebuilt after next Dotclear release"
            echo "Branch ${BRANCH} has been created from ${GITHUB_REF_NAME} without Dotclear archive." >> "$GITHUB_STEP_SUMMARY"
          fi
          git push origin "$BRANCH"

  do_image:
    needs: [check_image, create_branch]
    name: Stable image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      canal: stable
      ref: ${{ needs.check_image.outputs.version }}
      tags: ${{ needs.check_image.outputs.version }} latest
      previous_tag: latest
      archive_checksum: ${{ needs.check_image.outputs.archive_md5 }}
      scout_environment: stable

  # One GitHub release by stable image (tag vX.Y.Z on the version branch),
  # with the versions of what the image contains. Updated if image is rebuilt.
  release:
    needs: [check_image, do_image]
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out version branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check_image.outputs.version }}

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check_image.outputs.version }}
          DIGEST: ${{ needs.do_image.outputs.digest }}
          DOTCLEAR: ${{ needs.do_image.outputs.dotclear }}
          ALPINE: ${{ needs.do_image.outputs.alpine }}
          NGINX: ${{ needs.do_image.outputs.nginx }}
          PHP: ${{ needs.do_image.outputs.php }}
        run: |
          function plugin { sed -n "s/^\s*DC_DOCKER_PLUGIN_$1=\([0-9][0-9.]*\).*/\1/p" Dockerfile; }
          archive=$(sed -n 's/^url=//p' etc/dotclear-stable.lock 2> /dev/null || true)
          md5=$(sed -n 's/^md5=//p' etc/dotclear-stable.lock 2> /dev/null || true)
          {
            echo "Docker image of Dotclear ${VERSION}."
            echo
            echo "    docker pull ${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}:${VERSION}"
            echo "    docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
            echo
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| Dotclear | ${DOTCLEAR:-unknown} |"
            echo "| Alpine | ${ALPINE:-unknown} |"
            echo "| Nginx | ${NGINX:-unknown} |"
            echo "| PHP | ${PHP:-unknown} |"
            echo "| Plugin DotclearWatch | $(plugin DOTCLEARWATCH) |"
            echo "| Plugin dcLog | $(plugin DCLOG) |"
            echo "| Plugin sysInfo | $(plugin SYSINFO) |"
            echo "| Plugin TemplateHelper | $(plugin TEMPLATEHELPER) |"
            echo
            echo "* Image digest: \`${DIGEST}\`"
            if [ -n "$archive" ]; then
              echo "* Dotclear archive: ${archive} (md5 \`${md5}\`)"
            fi
            echo "* Built on $(date -u '+%Y-%m-%d %H:%M') UTC from branch \`${VERSION}\`"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file notes.md
          else
            gh release create "v${VERSION}" --target "${VERSION}" --title "Dotclear ${VERSION}" --notes-file notes.md
          fi
