name: Clean - workflow runs (weekly)
on:
  schedule:
    - cron: '45 11 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'retain days'
        required: true
        default: '15'
        type: choice
        options:
        - '1'
        - '2'
        - '7'
        - '15'

jobs:
  del_runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Scheduled runs have no input
          retain_days: ${{ inputs.days || '15' }}
          keep_minimum_runs: 7
