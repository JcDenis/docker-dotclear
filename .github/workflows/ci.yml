# Checks of pull requests and of master branch:
# workflows and Dockerfile syntax, then image build and container start.
name: Tests

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'exemple/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Check workflows and Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check workflows
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Check Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < Dockerfile

  image:
    name: Build and start ${{ matrix.canal }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        canal: [stable, testing, unstable]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg "CANAL=${{ matrix.canal }}" -t docker-dotclear:test .

      - name: Start container
        run: docker run -d --name dotclear -p 8080:80 docker-dotclear:test

      - name: Wait for container healthcheck
        run: |
          for _ in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dotclear)
            echo "Container is ${status}"
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect --format '{{.State.Running}}' dotclear)" != "true" ]; then
              echo "::error::Container is stopped"
              break
            fi
            sleep 5
          done
          [ "$status" = "healthy" ]

      - name: Check web server response
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          echo "Web server responds with HTTP code ${code}"
          [ "$code" -lt 500 ]

      - name: Show container logs
        if: ${{ always() }}
        run: docker logs dotclear
