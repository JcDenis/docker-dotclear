# Monthly cleaning of GitHub registry (ghcr.io): each build leaves the previous
# image of a tag without tag. Tagged images and their platforms are kept.
# Manual runs only list what would be deleted, unless "dry run" is unchecked.
name: Clean - registry (monthly)

on:
  schedule:
  - cron: '20 12 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (only list images to delete)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  clean:
    name: Delete untagged images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ github.token }}
          package: docker-dotclear
          delete-untagged: true
          # Images being built are pushed without tag before their tests
          older-than: 2 days
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
