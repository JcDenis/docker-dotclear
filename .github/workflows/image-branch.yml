# Build an image from the selected branch, tagged with the branch name.
# For a version branch, see also etc/dotclear-stable.lock.
name: Image - from a branch (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_branch:
    name: Check selected branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check branch
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "::error::This workflow must be launched from a branch other than master"
            exit 1
          fi
          # A version branch can be rebuilt if its Dotclear archive is set, else
          # Dockerfile downloads the current stable release of Dotclear: an old
          # version branch would give an image with a wrong Dotclear version.
          archive=$(sed -n 's/^url=//p' etc/dotclear-stable.lock 2> /dev/null || true)
          if [ -n "$archive" ]; then
            echo "Image is built with Dotclear archive ${archive}." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9][0-9.]*$'; then
            function normalize { echo "$1" | sed -E 's/(\.0)+$//'; }
            published=$(bash .github/scripts/dotclear-release.sh stable | sed -n 's/^version=//p')
            if [ -z "$published" ]; then
              echo "::error::Published Dotclear stable version not found, cannot check branch ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [ "$(normalize "$published")" != "$(normalize "$GITHUB_REF_NAME")" ]; then
              echo "::error::Branch ${GITHUB_REF_NAME} is not the current Dotclear stable release (${published}), its image would contain Dotclear ${published}"
              exit 1
            fi
          fi
          # Image tag can not contain a slash
          echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

  build_image:
    needs: check_branch
    name: Branch image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      canal: stable
      tags: ${{ needs.check_branch.outputs.tag }}
      scout_environment: stable
