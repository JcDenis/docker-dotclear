# Manual build of the dev image, whatever has changed or not.
name: 1. Rebuild dev image

on:
  workflow_dispatch:
  # TEMPORARY: test before merge
  push:
    branches:
      - workflows-improve

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-dev.yml
    secrets: inherit
    with:
      force: true

  # TEMPORARY: test before merge, image must not be built again
  unchanged:
    needs: rebuild
    name: Unchanged
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-dev.yml
    secrets: inherit
    with:
      force: false
