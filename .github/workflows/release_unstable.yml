name: Build and push dev image

on:
  schedule:
  - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  do_image:
    name: Dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      canal: unstable
      tags: dev
      scout_environment: unstable
      # No linux/arm/v6 for dev image
      platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
