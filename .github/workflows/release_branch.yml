name: Build and push image from branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_branch:
    name: Check selected branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check branch
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "::error::This workflow must be launched from a branch other than master"
            exit 1
          fi
          # Dockerfile downloads the current stable release of Dotclear: an old
          # version branch would give an image with a wrong Dotclear version.
          if echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9][0-9.]*$'; then
            function normalize { echo "$1" | sed -E 's/(\.0)+$//'; }
            published=$(curl -fsSL --retry 3 https://download.dotclear.org/versions.xml | python3 -c 'import sys, xml.etree.ElementTree as ET; print(next((r.get("version", "") for r in ET.parse(sys.stdin).getroot().iter("release") if r.get("name") == "stable"), ""))' || true)
            if [ -z "$published" ]; then
              echo "::error::Published Dotclear stable version not found, cannot check branch ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [ "$(normalize "$published")" != "$(normalize "$GITHUB_REF_NAME")" ]; then
              echo "::error::Branch ${GITHUB_REF_NAME} is not the current Dotclear stable release (${published}), its image would contain Dotclear ${published}"
              exit 1
            fi
          fi
          # Image tag can not contain a slash
          echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

  build_image:
    needs: check_branch
    name: Branch image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      canal: stable
      tags: ${{ needs.check_branch.outputs.tag }}
      scout_environment: stable
