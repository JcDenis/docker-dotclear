# Testing image is built every day, only if Dotclear testing release or sources
# of the image have changed, and every monday for Alpine packages updates.
name: Image - testing (daily)

on:
  schedule:
  - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build image even if nothing has changed'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  # Testing image is built from the branch of the last stable image,
  # this branch is created by the stable workflow (image-stable.yml)
  check:
    name: Check testing image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      build: ${{ steps.check.outputs.build }}
      checksum: ${{ steps.check.outputs.checksum }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Get last version branch of this repository
        id: branch
        run: |
          last=$(git ls-remote --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" | sed -n 's#^\([0-9a-f]*\)\s*refs/heads/\([0-9][0-9.]*\)$#\2 \1#p' | sort -V | tail -n 1)
          name="${last%% *}"
          sha="${last##* }"
          if [ -z "$name" ]; then
            echo "::error::No version branch found in this repository"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Testing image is built from branch ${name}." >> "$GITHUB_STEP_SUMMARY"

      - name: Check Dotclear release and published image
        id: check
        env:
          FORCE: ${{ inputs.force }}
          REVISION: ${{ steps.branch.outputs.sha }}
        run: bash .github/scripts/check-update.sh testing testing "$REVISION" "$FORCE"

  do_image:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    name: Testing image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      canal: testing
      ref: ${{ needs.check.outputs.branch }}
      tags: testing
      previous_tag: testing
      archive_checksum: ${{ needs.check.outputs.checksum }}
      scout_environment: testing
