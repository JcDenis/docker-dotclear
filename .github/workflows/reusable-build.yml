# Reusable workflow: build, test, publish and scan one docker-dotclear image.
#
# Called by the image-*.yml workflows. Workflows and scripts always come from
# the branch that triggers them (master for scheduled ones), only the Dockerfile
# and its files come from the "ref" input.
#
# Image is built without cache and pushed without tag. Tags are set only if the
# image passes the tests (.github/scripts/test-image.sh), a failing image is
# never published.
name: Internal - build image

on:
  workflow_call:
    inputs:
      canal:
        description: 'Dotclear release canal (stable | testing | unstable)'
        required: true
        type: string
      ref:
        description: 'Branch of this repository to build from (default: branch of the caller)'
        required: false
        type: string
        default: ''
      tags:
        description: 'Space separated list of image tags to publish'
        required: true
        type: string
      previous_tag:
        description: 'Tag of the published image used to test the upgrade (optional)'
        required: false
        type: string
        default: ''
      archive_checksum:
        description: 'Checksum of the Dotclear archive, kept in image labels (optional)'
        required: false
        type: string
        default: ''
      scout_environment:
        description: 'Docker Scout environment'
        required: true
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
    outputs:
      digest:
        description: 'Digest of the published image'
        value: ${{ jobs.build.outputs.digest }}
      dotclear:
        description: 'Dotclear version of the image'
        value: ${{ jobs.build.outputs.dotclear }}
      alpine:
        description: 'Alpine version of the image'
        value: ${{ jobs.build.outputs.alpine }}
      nginx:
        description: 'Nginx version of the image'
        value: ${{ jobs.build.outputs.nginx }}
      php:
        description: 'PHP version of the image'
        value: ${{ jobs.build.outputs.php }}

env:
  DOTCLEAR_IMAGE: docker-dotclear
  DOCKER_NAMESPACE: jcpd

jobs:
  build:
    name: Build, test and publish ${{ inputs.canal }} image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: build-${{ inputs.canal }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      dotclear: ${{ steps.test.outputs.dotclear }}
      alpine: ${{ steps.test.outputs.alpine }}
      nginx: ${{ steps.test.outputs.nginx }}
      php: ${{ steps.test.outputs.php }}
    steps:
      - name: Check out workflows scripts
        id: checkout_scripts
        uses: actions/checkout@v7
        with:
          path: tools

      - name: Check out image sources
        id: checkout_sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: src

      - name: Set images names
        id: names
        run: |
          {
            echo "dockerhub=${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}"
            echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "revision=$(git -C src rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        id: login_dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Github registry
        id: login_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image is pushed to registries without tag
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: src
          sbom: true
          no-cache: true
          outputs: type=image,"name=${{ steps.names.outputs.dockerhub }},${{ steps.names.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            io.github.jcdenis.docker-dotclear.archive-checksum=${{ inputs.archive_checksum }}
          build-args: CANAL=${{ inputs.canal }}
          platforms: ${{ inputs.platforms }}

      - name: Test image
        id: test
        env:
          IMAGE: ${{ steps.names.outputs.dockerhub }}@${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ inputs.previous_tag != '' && format('{0}:{1}', steps.names.outputs.dockerhub, inputs.previous_tag) || '' }}
        run: bash tools/.github/scripts/test-image.sh "$IMAGE" "$PREVIOUS"

      - name: Publish image tags
        id: publish
        env:
          TAGS: ${{ inputs.tags }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          GHCR: ${{ steps.names.outputs.ghcr }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "${DOCKERHUB}:${tag}" "${DOCKERHUB}@${DIGEST}"
            docker buildx imagetools create --tag "${GHCR}:${tag}" "${GHCR}@${DIGEST}"
            echo "Image ${DOCKERHUB}:${tag} published (${DIGEST})." >> "$GITHUB_STEP_SUMMARY"
          done
          echo "first=${TAGS%% *}" >> "$GITHUB_OUTPUT"

      # Provenance attestation is stored on GitHub, check it with:
      # gh attestation verify oci://ghcr.io/jcdenis/docker-dotclear:<tag> --owner JcDenis
      - name: Attest image provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # A failing analysis must not mark a published image as failed
      - name: Docker Scout
        id: scout
        continue-on-error: true
        uses: docker/scout-action@v1.29.0
        with:
          command: environment,quickview,cves,recommendations
          image: ${{ steps.names.outputs.dockerhub }}:${{ steps.publish.outputs.first }}
          environment: ${{ inputs.scout_environment }}
          organization: ${{ env.DOCKER_NAMESPACE }}

      - name: Send Telegram message
        if: ${{ always() }}
        env:
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
          CANAL: ${{ inputs.canal }}
          TAGS: ${{ inputs.tags }}
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
          DOTCLEAR_VERSION: ${{ steps.test.outputs.dotclear }}
          SCOUT: ${{ steps.scout.outcome }}
          ATTEST: ${{ steps.attest.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            text="✅ <b>${DOTCLEAR_IMAGE}</b>: ${CANAL} image published"
            text+=$'\n'"Dotclear: <b>${DOTCLEAR_VERSION:-unknown}</b>"
            text+=$'\n'"Tags: <code>${TAGS}</code>"
            text+=$'\n'"Built from branch: <code>${BUILD_REF}</code>"
            if [ "$SCOUT" = "failure" ]; then
              text+=$'\n'"⚠️ Docker Scout analysis failed"
            fi
            if [ "$ATTEST" = "failure" ]; then
              text+=$'\n'"⚠️ Provenance attestation failed"
            fi
          else
            failed=$(echo "$STEPS" | jq -r '[to_entries[] | select(.value.outcome == "failure" and .key != "scout" and .key != "attest") | .key] | join(", ")')
            text="❌ <b>${DOTCLEAR_IMAGE}</b>: ${CANAL} image build ${JOB_STATUS}, image not published"
            text+=$'\n'"Tags: <code>${TAGS}</code>"
            text+=$'\n'"Built from branch: <code>${BUILD_REF}</code>"
            text+=$'\n'"Failed step: <code>${failed:-unknown}</code>"
          fi
          text+=$'\n'"<a href=\"${RUN_URL}\">Workflow run</a>"
          if [ -f tools/.github/scripts/telegram.sh ]; then
            bash tools/.github/scripts/telegram.sh "$text"
          else
            echo "::warning::Telegram script not found, message not sent"
          fi
