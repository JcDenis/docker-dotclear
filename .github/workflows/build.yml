# Reusable workflow: build, push and scan one docker-dotclear image.
#
# Called by the release_*.yml workflows. Workflows always run from the branch
# that triggers them (master for scheduled ones), only the Dockerfile and its
# files come from the "ref" input. Images are built without cache, to always
# download the current Dotclear archive and Alpine packages.
name: Build image

on:
  workflow_call:
    inputs:
      canal:
        description: 'Dotclear release canal (stable | testing | unstable)'
        required: true
        type: string
      ref:
        description: 'Branch of this repository to build from (default: branch of the caller)'
        required: false
        type: string
        default: ''
      tags:
        description: 'Space separated list of image tags to push'
        required: true
        type: string
      scout_environment:
        description: 'Docker Scout environment'
        required: true
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x

env:
  DOTCLEAR_IMAGE: docker-dotclear
  DOCKER_NAMESPACE: jcpd

jobs:
  build:
    name: Build and push ${{ inputs.canal }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        id: login_dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Github registry
        id: login_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set images tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo 'list<<EOF'
            for tag in $TAGS; do
              echo "${DOCKER_NAMESPACE}/${DOTCLEAR_IMAGE}:${tag}"
              echo "ghcr.io/${GITHUB_REPOSITORY,,}:${tag}"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "first=${TAGS%% *}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          push: true
          no-cache: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: CANAL=${{ inputs.canal }}
          platforms: ${{ inputs.platforms }}

      - name: Read Dotclear version of the image
        id: dotclear
        continue-on-error: true
        env:
          IMAGE: ${{ env.DOCKER_NAMESPACE }}/${{ env.DOTCLEAR_IMAGE }}:${{ steps.tags.outputs.first }}
        run: |
          version=$(docker run --rm --pull always --platform linux/amd64 --entrypoint cat "$IMAGE" /usr/src/dotclear/release.json | jq -r '.release_version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Image ${IMAGE} contains Dotclear ${version}." >> "$GITHUB_STEP_SUMMARY"

      # A failing analysis must not mark a pushed image as failed
      - name: Docker Scout
        id: scout
        continue-on-error: true
        uses: docker/scout-action@v1.29.0
        with:
          command: environment,quickview,cves,recommendations
          image: ${{ env.DOCKER_NAMESPACE }}/${{ env.DOTCLEAR_IMAGE }}:${{ steps.tags.outputs.first }}
          environment: ${{ inputs.scout_environment }}
          organization: ${{ env.DOCKER_NAMESPACE }}

      - name: Send Telegram message
        if: ${{ always() }}
        env:
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
          CANAL: ${{ inputs.canal }}
          TAGS: ${{ inputs.tags }}
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
          DOTCLEAR_VERSION: ${{ steps.dotclear.outputs.version }}
          SCOUT: ${{ steps.scout.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_ID" ] || [ -z "$TELEGRAM_TOKEN" ]; then
            echo "No Telegram settings, message not sent"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            text="✅ <b>${DOTCLEAR_IMAGE}</b>: ${CANAL} image published"
            text+=$'\n'"Dotclear: <b>${DOTCLEAR_VERSION:-unknown}</b>"
            text+=$'\n'"Tags: <code>${TAGS}</code>"
            text+=$'\n'"Built from branch: <code>${BUILD_REF}</code>"
            if [ "$SCOUT" = "failure" ]; then
              text+=$'\n'"⚠️ Docker Scout analysis failed"
            fi
          else
            failed=$(echo "$STEPS" | jq -r '[to_entries[] | select(.value.outcome == "failure" and .key != "scout" and .key != "dotclear") | .key] | join(", ")')
            text="❌ <b>${DOTCLEAR_IMAGE}</b>: ${CANAL} image build ${JOB_STATUS}"
            text+=$'\n'"Tags: <code>${TAGS}</code>"
            text+=$'\n'"Built from branch: <code>${BUILD_REF}</code>"
            text+=$'\n'"Failed step: <code>${failed:-unknown}</code>"
          fi
          text+=$'\n'"<a href=\"${RUN_URL}\">Workflow run</a>"
          curl -fsS -o /dev/null --retry 3 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" || echo "::warning::Telegram message not sent"
