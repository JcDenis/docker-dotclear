# Weekly check of the last stable image: a Telegram message is sent if critical
# or high vulnerabilities with an available fix are found. Stable images are
# frozen, fix them with workflow "2. Rebuild last stable image".
name: Check - security of last stable image (weekly)

on:
  schedule:
  - cron: '40 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: jcpd/docker-dotclear:latest

jobs:
  scan:
    name: Scan last stable image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Docker Scout action downloads its binary without authentication,
      # randomly refused by GitHub (HTTP 403): download it with the token
      - name: Prepare Docker Scout
        id: scout_binary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/scout-binary.sh

      - name: Docker Scout
        id: scout
        continue-on-error: true
        uses: docker/scout-action@v1.30.0
        with:
          command: cves
          image: ${{ env.IMAGE }}
          only-severities: critical,high
          only-fixed: true
          sarif-file: scout.sarif
          organization: jcpd

      - name: Read results
        env:
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SCOUT: ${{ steps.scout.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCOUT" != "success" ] || [ ! -s scout.sarif ]; then
            echo "::error::Docker Scout analysis failed"
            text="⚠️ <b>docker-dotclear</b>: security check of <code>${IMAGE}</code> failed, analysis not done."
            text+=$'\n'"<a href=\"${RUN_URL}\">Workflow run</a>"
            bash .github/scripts/telegram.sh "$text"
            exit 1
          fi
          ids=$(jq -r '[.runs[].results[].ruleId] | unique | .[]' scout.sarif)
          count=$(echo "$ids" | grep -c . || true)
          if [ "$count" = "0" ]; then
            echo "No critical or high vulnerability with an available fix in ${IMAGE}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          list=$(echo "$ids" | head -n 10 | paste -sd ' ' -)
          echo "::warning::${count} critical or high vulnerabilities with an available fix in ${IMAGE}"
          echo "${count} critical or high vulnerabilities with an available fix in ${IMAGE}: ${list}" >> "$GITHUB_STEP_SUMMARY"
          # Docker Scout reports a fix as soon as it exists in any Alpine branch
          # (often edge only): a rebuild helps only if the Alpine branch of the
          # image has package updates.
          if check=$(docker run --rm --pull always --platform linux/amd64 --entrypoint /bin/sh "$IMAGE" \
            -c 'cat /etc/alpine-release && apk update -q > /dev/null && apk upgrade --simulate' 2> /dev/null); then
            alpine=$(echo "$check" | head -n 1)
            updates=$(echo "$check" | tail -n +2 | grep -c 'Upgrading ' || true)
          else
            alpine=""
            updates=""
            echo "::warning::Packages updates of ${IMAGE} could not be checked"
          fi
          echo "Alpine ${alpine:-unknown}, packages updates: ${updates:-not checked}." >> "$GITHUB_STEP_SUMMARY"
          text="🛡 <b>docker-dotclear</b>: ${count} critical or high vulnerabilities with an available fix in <code>${IMAGE}</code>"
          text+=$'\n'"<code>${list}</code>"
          if [ "$updates" = "0" ]; then
            text+=$'\n'"Fixes are not yet published for Alpine ${alpine}, nothing to do: a rebuild will fix them when they are."
          elif [ -n "$updates" ]; then
            text+=$'\n'"${updates} Alpine packages can be updated, run workflow <b>2. Rebuild last stable image</b>."
          else
            text+=$'\n'"Packages updates could not be checked, a rebuild with workflow <b>2. Rebuild last stable image</b> may fix them."
          fi
          text+=$'\n'"<a href=\"${RUN_URL}\">Workflow run</a>"
          bash .github/scripts/telegram.sh "$text"
